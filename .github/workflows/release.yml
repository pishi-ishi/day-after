name: release

# Tag vX.Y.Z to build one binary per OS and attach them to a GitHub release with their SHA-256.
# Run it by hand (workflow_dispatch) to build the binaries as workflow artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[build]"
      - name: Icon
        run: python packaging/make_icon.py
      - name: Build
        run: python packaging/build.py
      - name: Smoke test the binary
        shell: bash
        run: |
          BIN=$(ls dist/dayafter-* | grep -v '\.sha256$')
          "$BIN" --version
          "$BIN" --selftest
      - uses: actions/upload-artifact@v4
        with:
          name: dayafter-${{ matrix.os }}
          path: dist/dayafter-*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          {
            echo "Day After ${GITHUB_REF_NAME}: one file per OS, no installation. Run it and the app opens in your browser."
            echo
            echo "| File | SHA-256 |"
            echo "|---|---|"
            awk '{print "| `" $2 "` | `" $1 "` |"}' SHA256SUMS.txt
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Day After ${GITHUB_REF_NAME}" \
            --notes-file notes.md $(ls dayafter-* | grep -v '\.sha256$') SHA256SUMS.txt

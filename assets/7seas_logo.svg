<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 352 292" width="352" height="292" role="img" aria-label="Seven Seas Marine Electronics">
  <title>Seven Seas Marine Electronics</title>
  <!-- Vector redraw of the 7seasmarine.me logo (two masts, two sails, hull baseline + wordmark).
       Colour follows currentColor so the same file works black-on-light and white-on-dark. -->
  <g fill="none" stroke="currentColor" stroke-width="5.5" stroke-linecap="butt">
    <line x1="16" y1="242" x2="229" y2="242"/>
    <line x1="89" y1="13" x2="89" y2="278"/>
    <line x1="136" y1="13" x2="136" y2="278"/>
    <line x1="46" y1="242" x2="89" y2="76"/>
    <line x1="91" y1="242" x2="136" y2="76"/>
  </g>
  <g fill="currentColor" font-family="'Helvetica Neue', Helvetica, Arial, 'Inter', sans-serif" font-weight="600">
    <text x="160" y="127" font-size="47" letter-spacing="-0.5">Seven</text>
    <text x="160" y="175" font-size="47" letter-spacing="-0.5">Seas</text>
    <text x="160" y="224" font-size="47" letter-spacing="-0.5">Marine</text>
    <text x="160" y="275" font-size="23">Electronics</text>
  </g>
</svg>
